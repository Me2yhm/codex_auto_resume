name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx --yes @vscode/vsce@3.6.0 package --readme-path README.extension.md --out codex-auto-resume.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codex-auto-resume-vsix
          path: codex-auto-resume.vsix
          if-no-files-found: error
